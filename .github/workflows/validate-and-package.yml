name: Validate and package Sürüm 00

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_package:
        description: "Create the Sürüm 00 ZIP artifact only after explicit approval"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Python hazırla
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"

      - name: Python sürümünü doğrula
        run: |
          python - <<'PY'
          import sys

          expected = (3, 14, 8)
          print(f"CI Python: {sys.version}")
          if sys.version_info[:3] != expected:
              raise SystemExit(
                  f"Beklenen Python {expected[0]}.{expected[1]}.{expected[2]}, "
                  f"bulunan {sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}"
              )
          PY

      - name: Bağımlılıkları doğrula
        run: python -m pip install -r requirements.txt

      - name: Python kaynaklarını derle
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          excluded = {".git", ".github", ".venv", "venv", "__pycache__", "dist"}
          sources = [
              path for path in Path(".").rglob("*")
              if path.is_file()
              and path.suffix.lower() in {".py", ".pyw"}
              and not any(part in excluded for part in path.parts)
          ]
          if not sources:
              raise SystemExit("Kaynak dosyası bulunamadı.")
          for source in sorted(sources):
              py_compile.compile(str(source), doraise=True)
              print(f"OK: {source}")
          print(f"Derlenen dosya sayısı: {len(sources)}")
          PY

      - name: Ayar JSON dosyalarını doğrula
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ("ayarlar.json", "btcturk_usdt_spot.json"):
              value = json.loads(Path(name).read_text(encoding="utf-8-sig"))
              print(f"OK: {name} ({type(value).__name__})")
          PY

      - name: Otomatik birim testleri
        shell: bash
        run: python -m unittest discover -s tests -v

      - name: "Live integration: fetch real Binance and BtcTurk universes (temporary trigger)"
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[integration-s00]')
        run: |
          python - <<'PY'
          import time
          import logging

          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(name)s: %(message)s")
          from ortak_piyasa import fetch_binance_usdt_spot, fetch_btcturk_usdt_spot

          started = time.monotonic()
          binance = fetch_binance_usdt_spot()
          print(f"BINANCE_LIVE_USDT_SPOT_COUNT={len(binance)}", flush=True)
          print(f"BINANCE_BTCUSDT={binance.get('BTC')}", flush=True)
          if not binance or binance.get("BTC", {}).get("symbol") != "BTCUSDT":
              raise SystemExit("Actual fetch_binance_usdt_spot() did not return BTCUSDT.")

          btcturk = fetch_btcturk_usdt_spot(allow_unverified_cache=False)
          ticker_fallback = any(
              item.get("pair_status") == "TICKER_SNAPSHOT_FALLBACK_NOT_EXCHANGEINFO_VERIFIED"
              for item in btcturk.values()
          )
          print(f"BTCTURK_LIVE_USDT_COUNT={len(btcturk)}", flush=True)
          print(f"BTCTURK_USED_TICKER_FALLBACK={ticker_fallback}", flush=True)
          print(f"BTCTURK_BTCUSDT={btcturk.get('BTC')}", flush=True)
          if not btcturk or btcturk.get("BTC", {}).get("symbol") != "BTCUSDT":
              raise SystemExit("Actual fetch_btcturk_usdt_spot() did not return BTCUSDT.")
          if ticker_fallback:
              raise SystemExit("BtcTurk integration fell back to an unverified ticker instead of active exchangeInfo.")

          common = sorted(set(binance).intersection(btcturk))
          print(f"COMMON_LIVE_USDT_BASE_COUNT={len(common)}", flush=True)
          print(f"COMMON_SAMPLE={common[:25]}", flush=True)
          if "BTC" not in common or not common:
              raise SystemExit("The live Binance/BtcTurk common USDT universe is empty or missing BTC.")
          print(f"INTEGRATION_RESULT=PASS elapsed={time.monotonic()-started:.2f}s", flush=True)
          PY

      - name: Sürüm 00 ZIP ve SHA-256 oluştur (yalnızca açık seçimle)
        if: github.event_name == 'workflow_dispatch' && inputs.create_package == true
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          root = Path(".")
          dist = root / "dist"
          dist.mkdir(exist_ok=True)
          archive_path = dist / "Firsat-Kontrol-Paneli-Surum-00.zip"
          excluded_dirs = {".git", ".github", ".venv", "venv", "__pycache__", "dist", "data", "logs", "reports", "run", "tests"}
          with ZipFile(archive_path, "w", compression=ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(root)
                  if any(part in excluded_dirs for part in relative.parts):
                      continue
                  if path.suffix.lower() in {".zip", ".pyc", ".sha256"}:
                      continue
                  archive.write(path, relative.as_posix())

          with ZipFile(archive_path) as archive:
              bad_member = archive.testzip()
              if bad_member is not None:
                  raise SystemExit(f"ZIP bütünlük kontrolü başarısız: {bad_member}")

          digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          checksum_path = archive_path.with_suffix(archive_path.suffix + ".sha256")
          checksum_path.write_text(f"{digest}  {archive_path.name}\n", encoding="ascii")
          print(f"ZIP: {archive_path}")
          print(f"SHA-256: {digest}")
          PY

      - name: Sürüm 00 artifact'ini yayımla
        if: github.event_name == 'workflow_dispatch' && inputs.create_package == true
        uses: actions/upload-artifact@v7
        with:
          name: Firsat-Kontrol-Paneli-Surum-00
          path: |
            dist/Firsat-Kontrol-Paneli-Surum-00.zip
            dist/Firsat-Kontrol-Paneli-Surum-00.zip.sha256
          if-no-files-found: error
          retention-days: 14
