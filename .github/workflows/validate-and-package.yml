name: Validate and package Sürüm 00

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_package:
        description: "Create the Sürüm 00 ZIP artifact only after explicit approval"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Python hazırla
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"

      - name: Python sürümünü doğrula
        run: |
          python - <<'PY'
          import sys

          expected = (3, 14, 8)
          print(f"CI Python: {sys.version}")
          if sys.version_info[:3] != expected:
              raise SystemExit(
                  f"Beklenen Python {expected[0]}.{expected[1]}.{expected[2]}, "
                  f"bulunan {sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}"
              )
          PY

      - name: Bağımlılıkları doğrula
        run: python -m pip install -r requirements.txt

      - name: Python kaynaklarını derle
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          excluded = {".git", ".github", ".venv", "venv", "__pycache__", "dist"}
          sources = [
              path for path in Path(".").rglob("*")
              if path.is_file()
              and path.suffix.lower() in {".py", ".pyw"}
              and not any(part in excluded for part in path.parts)
          ]
          if not sources:
              raise SystemExit("Kaynak dosyası bulunamadı.")
          for source in sorted(sources):
              py_compile.compile(str(source), doraise=True)
              print(f"OK: {source}")
          print(f"Derlenen dosya sayısı: {len(sources)}")
          PY

      - name: Ayar JSON dosyalarını doğrula
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ("ayarlar.json", "btcturk_usdt_spot.json"):
              value = json.loads(Path(name).read_text(encoding="utf-8-sig"))
              print(f"OK: {name} ({type(value).__name__})")
          PY

      - name: Otomatik birim testleri
        shell: bash
        run: python -m unittest discover -s tests -v

      - name: Canlı REST uç noktalarını ayrı ayrı dene (yalnızca tanı tetiklemesinde)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[netcheck-s00]')
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time
          import requests

          cases = [
              ("Binance global market-data", "https://data-api.binance.vision/api/v3/exchangeInfo?symbol=BTCUSDT", "binance", True),
              ("Binance primary", "https://api.binance.com/api/v3/exchangeInfo?symbol=BTCUSDT", "binance", True),
              ("Binance GCP", "https://api-gcp.binance.com/api/v3/exchangeInfo?symbol=BTCUSDT", "binance", True),
              ("Binance api1", "https://api1.binance.com/api/v3/exchangeInfo?symbol=BTCUSDT", "binance", True),
              ("Binance api2", "https://api2.binance.com/api/v3/exchangeInfo?symbol=BTCUSDT", "binance", True),
              ("Binance api3", "https://api3.binance.com/api/v3/exchangeInfo?symbol=BTCUSDT", "binance", True),
              ("Binance api4", "https://api4.binance.com/api/v3/exchangeInfo?symbol=BTCUSDT", "binance", True),
              # Port 9443 is probed for diagnostic completeness, not assumed to be an official REST base.
              ("Binance primary:9443 extra probe", "https://api.binance.com:9443/api/v3/exchangeInfo?symbol=BTCUSDT", "binance", False),
              ("BtcTurk exchangeInfo", "https://api.btcturk.com/api/v2/server/exchangeinfo", "btcturk", True),
              ("BtcTurk ticker/currency", "https://api.btcturk.com/api/v2/ticker/currency?symbol=usdt", "btcturk", True),
              ("BtcTurk ticker", "https://api.btcturk.com/api/v2/ticker", "btcturk", True),
          ]

          def acceptable(status, body, kind):
              if status != 200:
                  return False, f"HTTP {status}"
              try:
                  value = json.loads(body)
              except Exception as exc:
                  return False, f"invalid JSON: {type(exc).__name__}"
              if kind == "binance":
                  rows = value.get("symbols") if isinstance(value, dict) else None
                  if not isinstance(rows, list):
                      return False, "JSON missing symbols[]"
                  if not any(isinstance(row, dict) and row.get("symbol") == "BTCUSDT" for row in rows):
                      return False, "symbols[] missing BTCUSDT"
                  return True, "HTTP 200 + valid exchangeInfo + BTCUSDT"
              if not isinstance(value, dict):
                  return False, "JSON root is not an object"
              if value.get("success") is False:
                  return False, f"API success=false; code={value.get('code')}"
              if "data" not in value:
                  return False, "JSON missing data"
              return True, "HTTP 200 + BtcTurk JSON data"

          results = []
          for label, url, kind, official_expected in cases:
              print(f"\n[{label}] {url}", flush=True)
              # Test Python/OpenSSL path.
              started = time.monotonic()
              try:
                  response = requests.get(
                      url, timeout=(5, 8),
                      headers={"User-Agent": "FirsatKontrol-Diagnostic/1.0", "Accept": "application/json"},
                  )
                  ok, detail = acceptable(response.status_code, response.content, kind)
                  print(f"  requests: {'PASS' if ok else 'FAIL'} status={response.status_code} "
                        f"time={time.monotonic()-started:.2f}s detail={detail}", flush=True)
                  results.append((label, "requests", ok, official_expected, kind))
              except Exception as exc:
                  print(f"  requests: FAIL time={time.monotonic()-started:.2f}s "
                        f"error={type(exc).__name__}: {str(exc)[:500]}", flush=True)
                  results.append((label, "requests", False, official_expected, kind))

              # Independently test libcurl/TLS path.
              started = time.monotonic()
              try:
                  command = [
                      "curl", "--disable", "--silent", "--show-error", "--fail", "--location",
                      "--connect-timeout", "5", "--max-time", "8",
                      "--user-agent", "FirsatKontrol-Diagnostic/1.0", url,
                  ]
                  completed = subprocess.run(command, capture_output=True, timeout=10, check=False)
                  if completed.returncode != 0:
                      error = completed.stderr.decode("utf-8", errors="replace").strip()
                      print(f"  curl: FAIL rc={completed.returncode} time={time.monotonic()-started:.2f}s "
                            f"error={error[:500]}", flush=True)
                      curl_ok = False
                  else:
                      curl_ok, detail = acceptable(200, completed.stdout, kind)
                      print(f"  curl: {'PASS' if curl_ok else 'FAIL'} time={time.monotonic()-started:.2f}s "
                            f"detail={detail}", flush=True)
                  results.append((label, "curl", curl_ok, official_expected, kind))
              except Exception as exc:
                  print(f"  curl: FAIL time={time.monotonic()-started:.2f}s "
                        f"error={type(exc).__name__}: {str(exc)[:500]}", flush=True)
                  results.append((label, "curl", False, official_expected, kind))

          print("\n========== SUMMARY ==========", flush=True)
          for label, transport, ok, expected, kind in results:
              print(f"{'PASS' if ok else 'FAIL'} | {label} | {transport} | documented={expected}", flush=True)
          official_binance = [
              (label, transport, ok) for label, transport, ok, expected, kind in results
              if kind == "binance" and expected and label != "Binance primary:9443 extra probe"
          ]
          btcturk = [(label, transport, ok) for label, transport, ok, expected, kind in results if kind == "btcturk"]
          binance_ok = any(ok for _label, _transport, ok in official_binance)
          btcturk_ok = any(ok for _label, _transport, ok in btcturk)
          print(f"Official Binance REST success: {sum(ok for _, _, ok in official_binance)}/{len(official_binance)} transport checks", flush=True)
          print(f"BtcTurk public REST success: {sum(ok for _, _, ok in btcturk)}/{len(btcturk)} transport checks", flush=True)
          if not binance_ok:
              raise SystemExit("All documented Binance REST bases failed from the GitHub runner.")
          if not btcturk_ok:
              raise SystemExit("All BtcTurk public REST endpoints failed from the GitHub runner.")
          PY

      - name: Binance canlı WebSocket uç noktalarını dene (yalnızca WS tanı tetiklemesinde)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[netcheck-ws-s00]')
        run: |
          python - <<'PY'
          import json
          import time
          import websocket

          endpoints = [
              ("Binance WebSocket stream :443", "wss://stream.binance.com:443/stream?streams=btcusdt@trade"),
              ("Binance market-data stream", "wss://data-stream.binance.vision:443/stream?streams=btcusdt@trade"),
              ("Binance WebSocket stream :9443", "wss://stream.binance.com:9443/stream?streams=btcusdt@trade"),
          ]
          results = []
          for label, url in endpoints:
              started = time.monotonic()
              sock = None
              try:
                  sock = websocket.create_connection(
                      url, timeout=8,
                      origin="https://www.binance.com",
                      enable_multithread=False,
                  )
                  raw = sock.recv()
                  if isinstance(raw, bytes):
                      raw = raw.decode("utf-8", errors="replace")
                  payload = json.loads(raw)
                  data = payload.get("data") if isinstance(payload, dict) else None
                  valid = (
                      isinstance(payload, dict)
                      and payload.get("stream") == "btcusdt@trade"
                      and isinstance(data, dict)
                      and data.get("e") == "trade"
                  )
                  if valid:
                      print(f"PASS | {label} | handshake + live BTCUSDT trade message | "
                            f"{time.monotonic()-started:.2f}s", flush=True)
                      results.append(True)
                  else:
                      print(f"FAIL | {label} | handshake succeeded but unexpected message: "
                            f"{str(payload)[:500]}", flush=True)
                      results.append(False)
              except Exception as exc:
                  print(f"FAIL | {label} | {type(exc).__name__}: {str(exc)[:700]} | "
                        f"{time.monotonic()-started:.2f}s", flush=True)
                  results.append(False)
              finally:
                  if sock is not None:
                      try:
                          sock.close()
                      except Exception:
                          pass
          print(f"WebSocket success: {sum(results)}/{len(results)} endpoints", flush=True)
          if not any(results):
              raise SystemExit("All Binance public WebSocket endpoints failed from the GitHub runner.")
          PY

      - name: Sürüm 00 ZIP ve SHA-256 oluştur (yalnızca açık seçimle)
        if: github.event_name == 'workflow_dispatch' && inputs.create_package == true
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          root = Path(".")
          dist = root / "dist"
          dist.mkdir(exist_ok=True)
          archive_path = dist / "Firsat-Kontrol-Paneli-Surum-00.zip"
          excluded_dirs = {".git", ".github", ".venv", "venv", "__pycache__", "dist", "data", "logs", "reports", "run", "tests"}
          with ZipFile(archive_path, "w", compression=ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(root)
                  if any(part in excluded_dirs for part in relative.parts):
                      continue
                  if path.suffix.lower() in {".zip", ".pyc", ".sha256"}:
                      continue
                  archive.write(path, relative.as_posix())

          with ZipFile(archive_path) as archive:
              bad_member = archive.testzip()
              if bad_member is not None:
                  raise SystemExit(f"ZIP bütünlük kontrolü başarısız: {bad_member}")

          digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          checksum_path = archive_path.with_suffix(archive_path.suffix + ".sha256")
          checksum_path.write_text(f"{digest}  {archive_path.name}\n", encoding="ascii")
          print(f"ZIP: {archive_path}")
          print(f"SHA-256: {digest}")
          PY

      - name: Sürüm 00 artifact'ini yayımla
        if: github.event_name == 'workflow_dispatch' && inputs.create_package == true
        uses: actions/upload-artifact@v7
        with:
          name: Firsat-Kontrol-Paneli-Surum-00
          path: |
            dist/Firsat-Kontrol-Paneli-Surum-00.zip
            dist/Firsat-Kontrol-Paneli-Surum-00.zip.sha256
          if-no-files-found: error
          retention-days: 14
